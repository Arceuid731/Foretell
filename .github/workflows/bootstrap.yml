name: Bootstrap Foretell

on:
  push:
    branches: [ main ]
    paths:
      - '.foretell-bootstrap'
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - name: Checkout Foretell
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import BossMod Reborn and apply Foretell
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/FFXIV-CombatReborn/BossmodReborn.git "$env:RUNNER_TEMP\BossmodReborn"
          python .bootstrap/apply.py "$env:RUNNER_TEMP\BossmodReborn" "$env:GITHUB_WORKSPACE"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath $dest

      - name: Restore
        run: dotnet restore BossMod/BossModReborn.csproj

      - name: Build V1
        shell: pwsh
        run: |
          dotnet build --no-restore -c Release BossMod/BossModReborn.csproj `
            -p:AssemblyVersion=0.1.0.0 `
            -p:FileVersion=0.1.0.0 `
            -p:PackageVersion=0.1.0.0 `
            -p:InformationalVersion=0.1.0.0 `
            --output .\build

      - name: Package plugin
        shell: pwsh
        run: |
          Get-ChildItem .\build\* -Exclude Foretell.*,DefaultRotationPresets.json,RebornPresets.json,PInvoke.User32.dll | Remove-Item -Force -Recurse
          Compress-Archive -Path .\build\* -DestinationPath .\Foretell.zip -Force

      - name: Generate Dalamud repository manifest
        shell: pwsh
        run: |
          $version = '0.1.0.0'
          $download = 'https://github.com/Arceuid731/Foretell/releases/download/v0.1.0/Foretell.zip'
          $manifest = Get-Content .\BossMod\Foretell.json -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName AssemblyVersion -NotePropertyValue $version -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $download -Force
          $manifest | ConvertTo-Json -Depth 10 -AsArray | Set-Content .\repo.json -Encoding utf8

      - name: Write Foretell README
        shell: pwsh
        run: |
          @'
          # Foretell

          Foretell is an experimental adaptive encounter-intelligence plugin for FFXIV, built on BossMod Reborn.

          V1 keeps the existing BMR stack available while adding local observation, mechanic-shape inference, confidence scoring, timeline learning, persistent encounter memory, replay/debug data, and predictive 3D/radar/text guidance.

          ## Dalamud custom repository

          `https://raw.githubusercontent.com/Arceuid731/Foretell/main/repo.json`

          ## Safety model

          Foretell is advisory by default. It does not add autonomous character movement. Low-confidence predictions are suppressed, especially for potentially lethal guidance. Learning data remains local.

          ## Upstream

          Based on FFXIV-CombatReborn/BossmodReborn. Upstream license and attribution are retained in this repository.
          '@ | Set-Content .\README.md -Encoding utf8

      - name: Commit bootstrapped source
        shell: pwsh
        run: |
          git config user.name 'Foretell Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap Foretell V1 from BossMod Reborn'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish V1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0 .\Foretell.zip --repo ${{ github.repository }} --target main --title 'Foretell v0.1.0' --notes 'Initial Foretell V1 experimental release.'
