name: Release Foretell

on:
  push:
    branches: [ main ]
    paths:
      - 'release.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foretell-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate zero-knowledge telemetry contract
        run: python .github/scripts/check_foretell_telemetry_contract.py

      - name: Read release configuration
        shell: pwsh
        run: |
          $cfg = Get-Content .\release.json -Raw | ConvertFrom-Json
          if (-not $cfg.version) { throw 'release.json must contain version' }
          $version = [string]$cfg.version
          $tag = "v$version"
          $assembly = if ($version.Split('.').Count -eq 3) { "$version.0" } else { $version }
          "FORETELL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FORETELL_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FORETELL_ASSEMBLY_VERSION=$assembly" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Refuse duplicate tag
        shell: pwsh
        run: |
          git fetch --tags --force
          if (git tag --list $env:FORETELL_TAG) { throw "Tag $env:FORETELL_TAG already exists" }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath $dest

      - name: Restore
        run: dotnet restore BossMod/BossModReborn.csproj

      - name: Build release
        shell: pwsh
        run: |
          dotnet build --no-restore -c Release BossMod/BossModReborn.csproj `
            -p:AssemblyVersion=$env:FORETELL_ASSEMBLY_VERSION `
            -p:FileVersion=$env:FORETELL_ASSEMBLY_VERSION `
            -p:PackageVersion=$env:FORETELL_ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:FORETELL_ASSEMBLY_VERSION `
            --output .\build

      - name: Package plugin
        shell: pwsh
        run: |
          if (-not (Test-Path .\build\Foretell.dll)) { throw 'Foretell.dll missing after build' }
          Get-ChildItem .\build\* -Exclude Foretell.*,DefaultRotationPresets.json,RebornPresets.json,PInvoke.User32.dll | Remove-Item -Force -Recurse
          Get-ChildItem .\build\Foretell.zip -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path .\build\* -DestinationPath .\Foretell.zip -Force
          Get-FileHash .\Foretell.zip -Algorithm SHA256 | Format-List

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          Foretell $env:FORETELL_VERSION

          Data-complete telemetry architecture.

          Full server/client IPC payloads and every ActorControl command are now retained continuously in a compact per-territory gzip journal. Network callbacks only copy immutable bytes and primitives; compression and disk I/O run on a dedicated background thread. Replay Lab remains an optional human-readable mirror and no longer controls whether raw evidence exists.

          Native ObjectEffect and actor/static VFX lifecycle sensors are re-enabled behind an unbounded primitive capture queue. Detours never enrich, correlate or learn. Foretell drains the queue on the framework thread with both a 96-item ceiling and a 0.75 ms time budget per frame, preserving capture timestamps, VFX paths, caster/target identity, positions and lifecycle duration.

          Direct Character memory snapshots are restored with both count and time budgets. Volatile player/cast/tether actors are prioritized at up to 4 Hz while a rotating cursor guarantees eventual coverage of every actor. Each snapshot includes both tether slots and progress, movement state, Timeline and sequencer arrays, ModelContainer, TransformationContainer, statuses, incoming ActionEffects and pending effects. Unchanged fingerprints never enter learning. Environment and complete camera matrices use a slower change-detected 2 Hz cadence.

          A reflection-free one-hertz snapshot covers all managed continuous state, including all 64 party/alliance/NPC slots, all 87 cooldown groups, complete waymarks/signs, gauges, combo, FATE, pets, companion, enmity, inventory, content values and every Deep Dungeon array. WorldState operations remain the lossless delta stream. Generic live reflection stays disabled; pointer/function and hand-authored BossMod/Splatoon knowledge remain excluded.

          The dashboard reports raw and native queue depth, written/rejected counts, snapshot/drain milliseconds and peaks, sensor failures, and unaccounted Dalamud services. Data-complete health fails visibly instead of silently claiming success when any source is unavailable. Diagnostics export the same counters.

          CI now enforces 137 telemetry and performance markers, lossless raw journaling, typed full-array coverage, deferred native detours and the absence of hand-authored arena topology. Multiple complete Windows builds were validated against the current Dalamud distribution before publication; runtime counters remain the authority for in-game health.
          "@
          gh release create $env:FORETELL_TAG .\Foretell.zip --repo ${{ github.repository }} --target ${{ github.sha }} --title "Foretell $env:FORETELL_TAG" --notes $notes

      - name: Update Dalamud repository manifest
        shell: pwsh
        run: |
          $download = "https://github.com/${{ github.repository }}/releases/download/$env:FORETELL_TAG/Foretell.zip"
          $manifest = Get-Content .\BossMod\Foretell.json -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName AssemblyVersion -NotePropertyValue $env:FORETELL_ASSEMBLY_VERSION -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $download -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $download -Force
          $manifest | ConvertTo-Json -Depth 10 -AsArray | Set-Content .\repo.json -Encoding utf8

          git config user.name 'Foretell Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add repo.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Foretell $env:FORETELL_TAG repository manifest"
            git push origin HEAD:main
          }
