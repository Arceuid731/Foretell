name: Apply Foretell EffectResult v7

on:
  push:
    branches: [ main ]
    paths:
      - 'effect-result-v7.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply EffectResult semantic correlation
        run: python .github/scripts/apply_effect_result_v7.py
      - name: Commit engine changes
        shell: bash
        run: |
          git config user.name 'Foretell EffectResult Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add BossMod/Foretell
          git commit -m 'Correlate EffectResult by native action sequence'
          git pull --rebase origin main
          git push origin HEAD:main
