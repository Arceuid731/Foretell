name: Build Foretell

on:
  push:
    branches: [ main ]
    paths:
      - 'BossMod/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/check_foretell_telemetry_contract.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'BossMod/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/check_foretell_telemetry_contract.py'
  workflow_dispatch:

concurrency:
  group: foretell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate zero-knowledge telemetry contract
        run: python .github/scripts/check_foretell_telemetry_contract.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud
        shell: pwsh
        run: |
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath $dest
      - run: dotnet restore BossMod/BossModReborn.csproj
      - name: Build
        shell: pwsh
        run: |
          dotnet build --no-restore -c Release BossMod/BossModReborn.csproj 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foretell-build-log
          path: build.log
          if-no-files-found: ignore
