name: Refine Foretell Metadata Priors

on:
  push:
    branches: [ main ]
    paths:
      - 'metadata-prior-refine.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply semantic refinements
        shell: python
        run: |
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              s = load(path)
              if old not in s:
                  raise RuntimeError(f'anchor not found in {path}: {old!r}')
              save(path, s.replace(old, new, 1))

          def regex_once(path, pattern, repl, flags=0):
              s = load(path)
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f'regex anchor not found in {path}: {pattern!r}')
              save(path, s2)

          # Schema migration for the new metadata-prior fields.
          replace_once('BossMod/Foretell/ForetellEngine.cs',
              '_store.Schema = Math.Max(_store.Schema, 2);',
              '_store.Schema = Math.Max(_store.Schema, 3);')

          # Metadata belongs in the common observation pipeline so Replay Lab exercises the same logic as live play.
          replace_once('BossMod/Foretell/ForetellObserver.cs',
              '        ProcessObservation(obs);\n        ApplyActionMetadataPrior(obs);',
              '        ProcessObservation(obs);')

          replace_once('BossMod/Foretell/ForetellLearning.cs',
              '            StartEpisode(observation, encounter);\n\n        _recentSignals.Enqueue(observation);',
              '            StartEpisode(observation, encounter);\n        if (observation.Kind == ObservationKind.CastStart)\n            ApplyActionMetadataPrior(observation);\n\n        _recentSignals.Enqueue(observation);')

          # Crosses can now be validated/refined empirically instead of remaining metadata-only shapes.
          replace_once('BossMod/Foretell/ForetellLearning.cs',
              '                Try(GeometryKind.Rectangle, length, halfWidth, p => p.Forward >= 0 && p.Forward <= length && MathF.Abs(p.Side) <= halfWidth);',
              '                Try(GeometryKind.Rectangle, length, halfWidth, p => p.Forward >= 0 && p.Forward <= length && MathF.Abs(p.Side) <= halfWidth);\n                Try(GeometryKind.Cross, length, halfWidth, p =>\n                    (MathF.Abs(p.Side) <= halfWidth && MathF.Abs(p.Forward) <= length) ||\n                    (MathF.Abs(p.Forward) <= halfWidth && MathF.Abs(p.Side) <= length));')

          # Legacy/offline fitter gets the same shape family for consistency.
          regex_once('BossMod/Foretell/ForetellGeometry.cs',
              r'(\s+Try\(new\(GeometryKind\.Rectangle, cast\.Origin, cast\.Rotation, length, halfWidth,\n\s+Score\(samples, p => InRect\(p, cast\.Origin, cast\.Rotation, length, halfWidth\)\)\)\);)',
              r'\1\n                Try(new(GeometryKind.Cross, cast.Origin, cast.Rotation, length, halfWidth,\n                    Score(samples, p => InCross(p, cast.Origin, cast.Rotation, length, halfWidth))));')

          # A static prior must not own the empirical score; otherwise a wrong prior can become impossible to dislodge.
          replace_once('BossMod/Foretell/ForetellActionMetadata.cs',
              '                mechanic.Score = Math.Max(mechanic.Score, p.Confidence);\n',
              '')

          # CastType proves the donut family, but a verified inner radius is not exposed by the Action fields we trust.
          regex_once('BossMod/Foretell/ForetellActionMetadata.cs',
              r'                case 10:.*?\n                    break;',
              '                case 10: // donut family; inner radius is not safely derivable from verified Action fields alone\n                    confidence = .60f;\n                    why = "CastType identifies donut family; inner radius requires Omen/outcome evidence before drawing";\n                    break;',
              re.S)

          # Prior confidence is reduced when empirical geometry or dimensions disagree.
          regex_once('BossMod/Foretell/ForetellModel.cs',
              r'            var empirical = EmpiricalConfidence;\n            if \(PriorConfidence <= 0\) return empirical;\n            if \(Observations == 0\) return PriorConfidence;\n\n.*?            return Math\.Clamp\(fused, 0, \.999f\);',
              '''            var empirical = EmpiricalConfidence;
            if (PriorConfidence <= 0) return empirical;
            if (Observations == 0) return PriorConfidence;

            var effectivePrior = PriorConfidence;
            if (PriorGeometry != GeometryKind.Unknown && Geometry != GeometryKind.Unknown)
            {
                if (PriorGeometry != Geometry)
                {
                    // Observed geometry-family disagreement means this Action sheet row is not describing the
                    // correlated encounter effect accurately enough to dominate the learner.
                    effectivePrior *= .20f;
                }
                else if (PriorP1 > 0 && P1 > 0)
                {
                    var drift1 = MathF.Abs(P1 - PriorP1) / MathF.Max(1, PriorP1);
                    var drift2 = PriorP2 > 0 && P2 > 0 ? MathF.Abs(P2 - PriorP2) / MathF.Max(1, PriorP2) : 0;
                    var drift = MathF.Max(drift1, drift2);
                    if (drift > .15f)
                        effectivePrior *= Math.Clamp(1f - drift, .25f, .85f);
                }
            }

            // Useful client metadata can make ordinary telegraphs useful on the first cast; repeated outcomes then
            // confirm, refine, or overrule it. A prior can accelerate confidence but can never reach the 99% safe gate alone.
            effectivePrior = Math.Min(effectivePrior, .98f);
            var fused = 1f - (1f - effectivePrior) * (1f - empirical);
            if (AmbiguousSamples > 0)
                fused *= 1f / (1f + AmbiguousSamples * .08f);
            return Math.Clamp(fused, 0, .999f);''',
              re.S)

          # Make the source of confidence obvious in the Inspector, not only exported JSON.
          source_line = '            ImGui.TextUnformatted($"Source: OID {mechanic.SourceOID:X8} ({mechanic.SourceKind}) | trigger: {mechanic.TriggerKind} ID {mechanic.TriggerID:X}");'
          replace_once('BossMod/Foretell/ForetellInspector.cs', source_line,
              source_line + '''
            if (mechanic.PriorConfidence > 0 || mechanic.PriorCastType != 0)
            {
                ImGui.TextUnformatted($"Client-data prior: {mechanic.PriorGeometry} {mechanic.PriorConfidence:P0} | CastType={mechanic.PriorCastType} | EffectRange={mechanic.PriorEffectRange} | XAxis={mechanic.PriorXAxisModifier} | TargetArea={mechanic.PriorTargetArea}");
                ImGui.TextUnformatted($"Omen: {mechanic.PriorOmenID}:{mechanic.PriorOmen}");
                ImGui.TextWrapped($"Prior rationale: {mechanic.PriorEvidence}");
            }''')

          gate_line = '        ImGui.TextUnformatted($"Confidence gates: {visual} visualizable (>= {_cfg.VisualConfidence:F0}%) | {warnings} warning-grade (>= {_cfg.WarningConfidence:F0}%) | {safe} safe-guidance-grade (>= {_cfg.SafeConfidence:F0}%) | {ambiguous} with conflicting evidence");'
          replace_once('BossMod/Foretell/ForetellInspector.cs', gate_line,
              gate_line + '\n        ImGui.TextUnformatted("Overlay/radar colors encode reliability: cyan = early/visual -> yellow = learned -> orange = high -> red = safe-guidance-grade. They do NOT encode damage severity.");')

      - name: Commit refinements
        shell: bash
        run: |
          git config user.name 'Foretell Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add BossMod/Foretell
          git commit -m 'Refine metadata priors and empirical override behavior'
          git pull --rebase origin main
          git push origin HEAD:main
