name: Refine Foretell Metadata Priors

on:
  push:
    branches: [ main ]
    paths:
      - 'metadata-prior-refine.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply final consistency fixes
        run: python .github/scripts/finalize_metadata.py

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name 'Foretell Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add BossMod/Foretell
          git commit -m 'Finalize metadata priors and confidence UX'
          git pull --rebase origin main
          git push origin HEAD:main
